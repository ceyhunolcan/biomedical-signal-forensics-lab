[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-signal-forensics-lab"
version = "0.16.1"
description = "A research-grade toolkit for detecting artifacts, confounding, and reliability failures in wearable and physiological signals."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "biomedical-signal-forensics-lab contributors"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
