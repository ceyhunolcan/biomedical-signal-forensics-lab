project:
  name: biomedical-signal-forensics-lab
  seed: 42
  output_dir: results
  data_dir: data

cohort:
  n_participants: 300
  n_days: 60
  short_window_seconds: 5
  ecg_sample_rate_hz: 250
  ppg_sample_rate_hz: 64
  devices: [device_A, device_B, device_C]
  sex_distribution: {F: 0.51, M: 0.49}
  age_range: [18, 75]

paths:
  synthetic_csv: data/synthetic/synthetic_signal_dataset.csv
  synthetic_windows: data/synthetic/synthetic_windows.npz
  processed_csv: data/processed/processed_signal_dataset.csv
  report_md: results/reports/signal_forensics_report.md
  leaderboard_csv: results/model_leaderboard.csv
  figures_dir: results/figures
