name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Sanity check imports
        run: |
          python -c "import biomedical_signal_forensics_lab as b; print('package version:', b.__version__)"

      - name: Run minimal test runner (no optional deps)
        run: |
          python scripts/run_tests_minimal.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=biomedical_signal_forensics_lab --cov-report=xml --cov-report=term \
            --ignore=tests/test_api.py \
            -W ignore::DeprecationWarning
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  pipeline-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate cohort
        run: python scripts/run_pipeline.py

      - name: Run signal audit
        run: python scripts/run_signal_audit.py

      - name: Train baselines
        run: python scripts/train_quality_model.py

      - name: Generate report
        run: python scripts/generate_report.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: audit-outputs
          path: |
            results/tables/
            results/figures/
            results/reports/
          retention-days: 14
