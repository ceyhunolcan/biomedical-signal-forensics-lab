name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution and verify metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect dist
        run: |
          ls -la dist/
          twine check dist/*

      - name: Install the wheel
        run: |
          python -m venv /tmp/install_test
          /tmp/install_test/bin/pip install dist/*.whl

      - name: Smoke import (best-effort)
        run: |
          # Try a handful of common import names; succeed if any work.
          /tmp/install_test/bin/python - << 'PY'
          import importlib, sys
          candidates = [
              "biomedical_signal_forensics_lab",
              "biomedical_signal_forensics",
              "bsfl",
              "src",
          ]
          for name in candidates:
              try:
                  m = importlib.import_module(name)
                  print(f"OK imported {name}; version={getattr(m, '__version__', '<unknown>')}")
                  sys.exit(0)
              except ImportError:
                  continue
          print(f"WARN: none of {candidates} imported; skipping import-test (build still succeeded)")
          PY
