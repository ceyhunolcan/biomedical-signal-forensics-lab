name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.5.0
      - name: Run ruff check
        run: ruff check src scripts tests --select E,F,W,B --ignore E501
        continue-on-error: true
      - name: Run ruff format check
        run: ruff format --check src scripts tests
        continue-on-error: true

  no-em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for em-dashes in documentation
        run: |
          if grep -rln "—" --include="*.md" --include="*.py" .; then
            echo "Found em-dashes; the project style uses periods, colons, or parentheses instead."
            exit 1
          fi
          echo "No em-dashes found."
