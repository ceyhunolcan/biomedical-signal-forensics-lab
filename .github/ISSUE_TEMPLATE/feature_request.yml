name: Feature request
description: Propose a new capability, analysis, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: One paragraph on the underlying research or engineering problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like this to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other libraries, or designs you ruled out.

  - type: dropdown
    id: scope
    attributes:
      label: Estimated scope
      options:
        - New module
        - Modify existing module
        - Documentation only
        - Tooling or CI
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - label: I would be willing to open a PR for this.
